<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Open Shortcut</title>
    <style>
      :root {
        color-scheme: light dark;
        font: 17px system-ui, sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }

      main {
        max-width: 30rem;
        padding: 2rem;
        text-align: center;
      }

      a {
        display: inline-block;
        padding: 0.7rem 1rem;
        border-radius: 0.6rem;
        color: white;
        background: #0066cc;
        text-decoration: none;
      }

      [hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">Opening Shortcuts…</h1>
      <p id="message">If nothing happens, tap below or open this page in Safari.</p>
      <a id="open" hidden>Open Shortcuts</a>
      <noscript>JavaScript is required to open this shortcut.</noscript>
    </main>

    <script>
      const params = new URLSearchParams(location.search);
      const name = params.get("name");
      const input = params.get("input");
      const title = document.querySelector("#title");
      const message = document.querySelector("#message");
      const link = document.querySelector("#open");

      if (!name || !params.has("input")) {
        title.textContent = "Missing shortcut or input";
        message.textContent = "Use ?name=Shortcut%20Name&input=Your%20text";
      } else {
        const shortcutUrl = `shortcuts://run-shortcut?name=${encodeURIComponent(name)}&input=text&text=${encodeURIComponent(input)}`;

        if (/Macintosh|iPhone|iPad|iPod/.test(navigator.userAgent)) {
          link.href = shortcutUrl;
          link.hidden = false;
          location.replace(shortcutUrl);
        } else {
          title.textContent = "Apple device required";
          message.textContent = "Open this link on an iPhone, iPad, or Mac.";
        }
      }
    </script>
  </body>
</html>
